  <text x="40" y="56.2" fill="#182b49" font-family="Arial, sans-serif" font-size="32" text-anchor="start" font-weight="700">Workload Management System | Chen ER model</text>
  <text x="40" y="93.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">Repeated entity names refer to the same entity. Underlined ovals are keys. Optional participation is stated beside each relationship.</text>
  <rect x="30" y="130" width="1240" height="720" rx="12" fill="white" stroke="#cfd9e8" stroke-width="2" />
  <text x="54" y="171.7" fill="#182b49" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="700">A. Organization and authentication</text>
  <text x="54" y="200.9" fill="#526782" font-family="Arial, sans-serif" font-size="14" text-anchor="start">MySQL operational entities; accounts are optional for an employee.</text>
