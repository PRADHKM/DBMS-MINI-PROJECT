  <text x="1350" y="1037.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">EMPLOYEE — HAS SKILL — SKILL  (M:N; proficiency belongs to the relationship)</text>
  <text x="1350" y="1113.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">EMPLOYEE (manager) — MANAGES — EMPLOYEE (report)  (1:N; optional manager)</text>
  <text x="1350" y="1189.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">EMPLOYEE (head) — HEADS — DEPARTMENT  (1:N; optional department head)</text>
  <text x="1350" y="1265.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">EMPLOYEE — FILES — RESIGNATION  (1:0..1)</text>
  <text x="1350" y="1341.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">EMPLOYEE (successor) — RECEIVES HANDOVER — RESIGNATION  (1:N)</text>
  <text x="1350" y="1417.3" fill="#182b49" font-family="Arial, sans-serif" font-size="18" text-anchor="start">EMPLOYEE — HAS SNAPSHOT — ai_work_summaries  (1:N; logical cross-engine link)</text>
  <text x="1350" y="1542.6" fill="#526782" font-family="Arial, sans-serif" font-size="16" text-anchor="start">Solid blue entities: MySQL tables. Dashed red entity: PostgreSQL/pgvector.</text>
