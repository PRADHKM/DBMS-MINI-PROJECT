  <text x="1334" y="171.7" fill="#182b49" font-family="Arial, sans-serif" font-size="22" text-anchor="start" font-weight="700">B. Work and contribution history</text>
  <text x="1334" y="200.9" fill="#526782" font-family="Arial, sans-serif" font-size="14" text-anchor="start">WORK_LOG stores the original author, even after task reassignment.</text>
